<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Girlfriend's Day</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0f172a,#2d1b69);overflow:hidden;color:#fff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;flex-direction:column;z-index:9}
.loader{width:70px;height:70px;border:6px solid #ffffff33;border-top-color:#ff5fa2;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{to{transform:translateY(-110vh)}}
.main{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{max-width:760px;width:100%;background:#ffffff14;backdrop-filter:blur(12px);padding:35px;border-radius:24px;text-align:center}
button{padding:14px 28px;border:none;border-radius:999px;background:#ff5fa2;color:#fff;font-size:18px;cursor:pointer}
#typed{white-space:pre-wrap;line-height:1.7;min-height:170px;margin-top:20px}
.heart{position:fixed;bottom:-30px;animation:float 8s linear forwards;color:#ff7db8}
</style></head>
<body>
<div id="loading"><div class="loader"></div><p>Preparing your surprise…</p></div>
<div class="main" id="main"><div class="card">
<h1>💖 Happy Girlfriend's Day 💖</h1>
<p>I made this little surprise just to make you smile today.</p>
<button onclick="start()">Open Your Surprise ❤️</button>
<div id="typed"></div>
<div id="extra" style="display:none">
<h3>One Last Thing…</h3>
<p>Thank you for being someone worth smiling about.<br>I hope today brings you happiness, laughter and beautiful moments. 🌸</p>
</div></div></div>
<script>
setTimeout(()=>{loading.style.display='none';main.style.display='flex'},1800);
const msg=`Happy Girlfriend's Day! 😊

I know it's just a fun internet day, but if there's someone who deserves a sweet message today, it's definitely you.

I hope your day is as lovely as your smile. 🌸`;
function start(){let i=0;typed.textContent='';
let t=setInterval(()=>{typed.textContent=msg.slice(0,i++);if(i>msg.length){clearInterval(t);extra.style.display='block';confetti();}},28);}
function confetti(){setInterval(()=>{let e=document.createElement('div');e.className='heart';e.textContent=Math.random()>.5?'❤':'💖';e.style.left=Math.random()*100+'vw';e.style.fontSize=(14+Math.random()*24)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),8000)},180)}
</script></body></html>
